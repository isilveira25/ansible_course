---
- hosts: all
  become: true
  pre_tasks:

  - name: install updates for Rocky
    tags: always
    ansible.builtin.dnf:
      update_only: yes
      update_cache: yes
    when: ansible_distribution == "Rocky" or ansible_distribution == "Fedora"

  - name: install updates for Ubuntu
    tags: always
    ansible.builtin.apt:
      upgrade: dist
      update_cache: yes
    when: ansible_distribution == "Ubuntu"

- hosts: web_servers
  become: true
  tasks: 

  - name: install apache on web servers (Ubuntu)
    tags: apache,ubuntu
    ansible.builtin.apt:
      name:
        - apache2
        - libapache2-mod-php
    when: ansible_distribution == "Ubuntu"

  - name: install apache on web servers (Rocky)
    tags: apache,rocky
    ansible.builtin.dnf:
      name: httpd
    when: ansible_distribution == "Rocky" or ansible_distribution == "Fedora"


  - name: ensure apache is running (Ubuntu)
    tags: apache,ubuntu
    ansible.builtin.service:
      name: apache2
      state: started
    when: ansible_distribution == "Ubuntu"  

  - name: ensure apache is running (Rocky)
    tags: apache,rocky
    ansible.builtin.service:
      name: httpd
      state: started
    when: ansible_distribution == "Rocky"  

  - name: change email address for admin
    tags: apache,rocky
    ansible.builtin.lineinfile:
      path: /etc/httpd/conf/httpd.conf
      regexp: '^ServerAdmin'
      line: ServerAdmin somebody@somehow.net
    when: ansible_distribution == "Rocky" or ansible_distribution == "Fedora"
    register: httpd  

  - name: copy html file for site
    tags: apache,ubuntu
    ansible.builtin.copy:
      src: default_site.html
      dest: /var/www/html/index.html
      owner: root
      group: root
      mode: 0644
    when: ansible_distribution == "Ubuntu"  


- hosts: db_servers
  tags: db,rocky
  become: true
  tasks:
    - name: install mariadb package on db servers
      ansible.builtin.dnf:
        name: mariadb
        state: latest

  - name: create user
    tags: always
    ansible.builtin.user:
      name: Ivan
      groups: root

