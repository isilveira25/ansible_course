  - name: create user
    tags: always
    ansible.builtin.user:
      name: ivan
      groups: root

  - name: add suddoers file for ivan
    tags: always
    ansible.builtin.copy:
      src: sudoer_ivan
      dest: /etc/sudoers.d/ivan
      owner: root
      group: root
      mode: 0440

  - name: add ssh key for ivan user
    tags: always
    ansible.builtin.authorized_key:
      user: ivan
      key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILXQQFPxhju0cxGrib5JgQjHDIFqVDgtPmDKB2qc6/pd lab@ubuntu-ws"
